name: Verify forecasting pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run regression tests when local tests are included
        if: ${{ hashFiles('tests/test_*.py') != '' }}
        run: python -m pytest -q
      - run: greenbond demo --rows 180 --rf-trials 1 --output reports/ci-demo
      - name: Verify generated dashboard and BI metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          root = Path("reports/ci-demo")
          facts = pd.read_csv(root / "forecast_facts.csv")
          scores = pd.read_csv(root / "metrics.csv").set_index("model")
          metadata = json.loads((root / "run.json").read_text())
          assert len(facts) == metadata["splits"]["test_rows"] * len(scores)
          assert not facts.duplicated(["date", "model"]).any()
          for model, rows in facts.groupby("model"):
              assert abs(rows["squared_error"].mean() - scores.loc[model, "mse"]) < 1e-10
          html = (root / "dashboard.html").read_text(encoding="utf-8")
          assert 'id="experiment-data"' in html
          assert 'id="model"' in html and 'id="forecast"' in html
          print("Dashboard, BI table, and metric consistency verified.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.python-version }}
          path: reports/ci-demo
