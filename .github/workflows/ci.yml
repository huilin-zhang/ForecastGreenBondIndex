name: Verify forecasting pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: greenbond demo --rows 180 --rf-trials 1 --output reports/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.python-version }}
          path: reports/ci-demo
