<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">Green Bond forecasting pipeline</title>
  <desc id="desc">Local S&amp;P index export and LSEG API or local predictor exports feed date and value validation, backward-only alignment and SQL audit, historical features, a chronological 60 / 20 / 20 split, training-fitted preprocessing, Naive / ARIMA / Random Forest / LSTM, rolling one-step evaluation, and metrics, figures, and run metadata.</desc>
